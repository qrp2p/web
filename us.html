        serviciosLista.appendChild(btn);
      }
      document.getElementById('paisesContainer').style.display = 'none';
      document.getElementById('serviciosPorPais').style.display = 'flex';
    }
    
    function volverPaises() {
      document.getElementById('paisesContainer').style.display = 'flex';
      document.getElementById('serviciosPorPais').style.display = 'none';
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span id="centrar-text">GETTING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { const { latitude, longitude } = pos.coords; if (userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28, 28] }) }).addTo(mapa).bindPopup(currentLang === 'es' ? 'Tu ubicación actual' : 'Your current location'); mapa.setView([latitude, longitude], 16); btn.innerHTML = originalHtml; },
          err => { console.warn(err); btn.innerHTML = originalHtml; mapa.setView([39.8283, -98.5795], 4); alert(currentLang === 'es' ? 'No se pudo obtener tu ubicación.' : 'Could not get your location.'); },
          { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
        );
      } else { mapa.setView([39.8283, -98.5795], 4); }
    }
    
    function openVisitaModal(property){ 
      currentProperty=property; selectedDate=null; selectedHorario=null; currentYear=new Date().getFullYear(); currentMonth=new Date().getMonth(); 
      let modal=document.getElementById('visitaModal'), container=document.getElementById('visitaFormContainer'); 
      let title = currentLang === 'es' ? property.title_es : property.title_en;
      let desc = currentLang === 'es' ? property.description_es : property.description_en;
      container.innerHTML=`<div class="property-info"><h4>🏠 ${title}</h4><p>${property.m2} m² · ${property.cuartos} ${currentLang==='es'?'hab':'beds'} · ${property.baños} ${currentLang==='es'?'baños':'baths'}</p><p>${desc}</p></div><div class="step-title">${t('visita_title')}</div><div class="form-group"><label>${t('nombre_label')}</label><input type="text" id="visitaNombre" placeholder="${currentLang==='es'?'Ej: Juan Pérez':'Ex: John Doe'}"></div><div class="row-2cols"><div class="form-group"><label>${t('tipo_id')}</label><input type="text" id="visitaTipoId" placeholder="${currentLang==='es'?'Ej: Cédula, Pasaporte...':'Ex: ID Card, Passport...'}"></div><div class="form-group"><label>${t('numero_id')}</label><input type="text" id="visitaNumeroId" placeholder="${currentLang==='es'?'Ej: 12345678':'Ex: 12345678'}"></div></div><div class="form-group"><label>${t('telefono_label')}</label><input type="tel" id="visitaTelefono" placeholder="3001234567"></div><div class="form-group"><label>${t('email_label')}</label><input type="email" id="visitaEmail"></div><div class="form-group"><label>${t('codigo_agente_label')}</label><input type="text" id="visitaCodigoAgente" placeholder="${currentLang==='es'?'Ej: AGENTE123':'Ex: AGENT123'}"></div><div class="inline-checkbox"><input type="checkbox" id="visitaTerms"><label>${t('terms_check')}<span class="terms-link" id="visitaTermsLink">${t('terms_link')}</span></label></div><div class="calendar-card"><div class="calendar-nav"><button class="popup-nav-btn" id="prevMonthBtn" style="background:#000;"><i class="fas fa-chevron-left"></i></button><div class="month-year"></div><button class="popup-nav-btn" id="nextMonthBtn" style="background:#000;"><i class="fas fa-chevron-right"></i></button></div><div class="weekdays"></div><div class="days-grid"></div></div><div class="form-group"><label>${currentLang==='es'?'HORARIO':'SCHEDULE'}</label><div class="horarios-list"></div></div><button class="btn-submit" id="submitVisita">${t('submit_visita')}</button>`; 
      let calendarDiv=container.querySelector('.calendar-card'); let prev=container.querySelector('#prevMonthBtn'), next=container.querySelector('#nextMonthBtn'), horariosDiv=container.querySelector('.horarios-list'); 
      renderCalendar(calendarDiv); if(horariosDiv) renderHorarios(horariosDiv); 
      if(prev) prev.addEventListener('click',()=>{ currentMonth--; if(currentMonth<0){currentMonth=11; currentYear--;} renderCalendar(calendarDiv); selectedDate=null; selectedHorario=null; if(horariosDiv) renderHorarios(horariosDiv); }); 
      if(next) next.addEventListener('click',()=>{ currentMonth++; if(currentMonth>11){currentMonth=0; currentYear++;} renderCalendar(calendarDiv); selectedDate=null; selectedHorario=null; if(horariosDiv) renderHorarios(horariosDiv); }); 
      document.getElementById('visitaTermsLink')?.addEventListener('click',showTermsModal); 
      document.getElementById('submitVisita').addEventListener('click',()=>{ 
        let nombre=document.getElementById('visitaNombre').value.trim(), telefono=document.getElementById('visitaTelefono').value.trim(), email=document.getElementById('visitaEmail').value.trim(), codigoAgente=document.getElementById('visitaCodigoAgente').value.trim(), termsChecked=document.getElementById('visitaTerms').checked;
        let tipoId = document.getElementById('visitaTipoId')?.value.trim() || '';
        let numeroId = document.getElementById('visitaNumeroId')?.value.trim() || '';
        if(!nombre||!telefono){alert(currentLang==='es'?'Completa nombre y teléfono':'Complete name and phone'); return;} 
        if(!tipoId || !numeroId){alert(currentLang==='es'?'Completa tipo y número de identificación':'Complete ID type and number'); return;}
        if(!termsChecked){alert(currentLang==='es'?'Acepta términos':'Accept terms'); return;} 
        if(!selectedDate){alert(currentLang==='es'?'Selecciona fecha':'Select date'); return;} 
        if(!selectedHorario){alert(currentLang==='es'?'Selecciona horario':'Select time'); return;} 
        let fecha=new Date(selectedDate).toLocaleDateString(currentLang==='es'?'es-ES':'en-US'); 
        let msg=`VISIT: ${title}\nName: ${nombre}\nID: ${tipoId} ${numeroId}\nPhone: ${telefono}\nEmail: ${email||'N/A'}\nDate: ${fecha} Time: ${selectedHorario}\n${codigoAgente ? `Agent Code: ${codigoAgente}` : ''}`; 
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank'); 
        modal.style.display='none'; 
      }); 
      modal.style.display='flex'; 
    }
    
    function openOfertaModal(property){ 
      currentProperty=property; 
      let modal=document.getElementById('ofertaModal'), container=document.getElementById('ofertaFormContainer'); 
      let title = currentLang === 'es' ? property.title_es : property.title_en;
      let desc = currentLang === 'es' ? property.description_es : property.description_en;
      let displayPrice = property.category==='sale' ? formatPriceForProp(property) : formatPriceForProp(property, true);
      let basePriceNum = property.category==='sale' ? property.price : 0;
      let minInitialPercent = 0.3;
      let defaultInitial = Math.floor(basePriceNum * minInitialPercent);
      
      let formHtml = `<div class="property-info"><h4>🏠 ${title}</h4><p>${property.m2} m² · ${property.cuartos} ${currentLang==='es'?'hab':'beds'} · ${property.baños} ${currentLang==='es'?'baños':'baths'}</p><p>${desc}</p></div><div class="step-title">${t('oferta_title')}</div>`;
      formHtml += `<div class="form-group"><label>${t('precio_fijo')}</label><div class="fixed-price-field"><strong>${displayPrice}</strong></div></div>`;
      if(property.category === 'sale' && property.price > 0) {
        formHtml += `<div class="form-group"><label>PAYMENT METHOD</label><div class="radio-group" id="paymentMethodGroup"><label><input type="radio" name="paymentMethod" value="contado" checked> ${t('pago_contado')}</label><label><input type="radio" name="paymentMethod" value="credito"> ${t('pago_credito')}</label></div></div>`;
        formHtml += `<div id="creditSection" style="display:none;"><div class="form-group"><label>${t('valor_inicial')}</label><input type="number" id="initialAmount" step="10000" value="${defaultInitial}" min="${defaultInitial}" max="${basePriceNum}"><small style="color:#555;">Minimum: ${formatPriceWithCurrency(defaultInitial, property.currency)} (30%)</small></div><div class="form-group"><label>${t('opciones_financiacion')}</label><div class="financing-option"><label><input type="radio" name="financingOption" value="${t('cesantias')}"> ${t('cesantias')}</label><label><input type="radio" name="financingOption" value="${t('credito_preaprobado')}"> ${t('credito_preaprobado')}</label><label><input type="radio" name="financingOption" value="${t('solicitar_credito')}"> ${t('solicitar_credito')}</label></div></div></div>`;
      }
      formHtml += `<div class="form-group"><label>${t('nombre_label')}</label><input type="text" id="ofertaNombre" placeholder="${currentLang==='es'?'Ej: Juan Pérez':'Ex: John Doe'}"></div>`;
      formHtml += `<div class="row-2cols"><div class="form-group"><label>${t('tipo_id')}</label><input type="text" id="ofertaTipoId" placeholder="${currentLang==='es'?'Ej: Cédula, Pasaporte...':'Ex: ID Card, Passport...'}"></div><div class="form-group"><label>${t('numero_id')}</label><input type="text" id="ofertaNumeroId" placeholder="${currentLang==='es'?'Ej: 12345678':'Ex: 12345678'}"></div></div>`;
      formHtml += `<div class="form-group"><label>${t('telefono_label')}</label><input type="tel" id="ofertaTelefono" placeholder="3001234567"></div><div class="form-group"><label>${t('email_label')}</label><input type="email" id="ofertaEmail"></div><div class="form-group"><label>${t('codigo_agente_label')}</label><input type="text" id="ofertaCodigoAgente" placeholder="${currentLang==='es'?'Ej: AGENTE123':'Ex: AGENT123'}"></div><div class="form-group"><label>${t('comentarios_label')}</label><textarea rows="2" id="ofertaComentarios" placeholder="${currentLang==='es'?'Ej: Requiero financiación...':'Ex: I need financing...'}"></textarea></div><button class="btn-submit" id="submitOferta">${t('submit_oferta')}</button>`;
      container.innerHTML = formHtml;
      
      if(property.category === 'sale' && property.price > 0) {
        let radios = document.querySelectorAll('#paymentMethodGroup input');
        let creditDiv = document.getElementById('creditSection');
        let initialInput = document.getElementById('initialAmount');
        function toggleCredit() { let selected = document.querySelector('input[name="paymentMethod"]:checked').value; creditDiv.style.display = selected === 'credito' ? 'block' : 'none'; }
        radios.forEach(r => r.addEventListener('change', toggleCredit));
        toggleCredit();
        if(initialInput) initialInput.addEventListener('change', function() { let val = parseFloat(this.value); if(isNaN(val)) this.value = defaultInitial; else if(val < defaultInitial) { alert(`Minimum down payment: ${formatPriceWithCurrency(defaultInitial, property.currency)}`); this.value = defaultInitial; } else if(val > basePriceNum) { alert(`Cannot exceed total price`); this.value = basePriceNum; } });
      }
      document.getElementById('submitOferta').addEventListener('click',()=>{ 
        let nombre=document.getElementById('ofertaNombre').value.trim(), tel=document.getElementById('ofertaTelefono').value.trim(), email=document.getElementById('ofertaEmail').value.trim(), coment=document.getElementById('ofertaComentarios').value.trim(), codigoAgente=document.getElementById('ofertaCodigoAgente').value.trim(); 
        let tipoId = document.getElementById('ofertaTipoId')?.value.trim() || '';
        let numeroId = document.getElementById('ofertaNumeroId')?.value.trim() || '';
        if(!nombre||!tel){alert(currentLang==='es'?'Completa datos básicos (nombre y teléfono)':'Complete basic data (name and phone)'); return;} 
        if(!tipoId || !numeroId){alert(currentLang==='es'?'Completa tipo y número de identificación':'Complete ID type and number'); return;}
        let paymentDetails = "";
        if(property.category === 'sale' && property.price > 0) {
          let method = document.querySelector('input[name="paymentMethod"]:checked')?.value || 'contado';
          if(method === 'contado') paymentDetails = `\nMethod: ${t('pago_contado')} - Total: ${displayPrice}`;
          else {
            let initialVal = document.getElementById('initialAmount')?.value || defaultInitial;
            let selectedFin = document.querySelector('input[name="financingOption"]:checked')?.value || '';
            if(!selectedFin) { alert(currentLang==='es'?'Selecciona opción de financiación':'Select financing option'); return; }
            paymentDetails = `\nMethod: ${t('pago_credito')}\nDown payment: ${formatPriceWithCurrency(parseInt(initialVal), property.currency)}\nFinancing: ${selectedFin}`;
          }
        }
        let msg = `OFFER: ${title}\nName: ${nombre}\nID: ${tipoId} ${numeroId}\nPhone: ${tel}\nEmail: ${email}\nComments: ${coment||(currentLang==='es'?'Sin comentarios':'No comments')}\n${codigoAgente ? `Agent Code: ${codigoAgente}` : ''}${paymentDetails}`; 
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank'); 
        modal.style.display='none'; 
      }); 
      modal.style.display='flex'; 
    }
    
    function renderCalendar(container) { let days=getDaysForMonth(currentYear,currentMonth); let monthSpan=container.querySelector('.month-year'); if(monthSpan) monthSpan.innerText=`${getMonthName(currentMonth)} ${currentYear}`; let daysGrid=container.querySelector('.days-grid'); if(!daysGrid) return; daysGrid.innerHTML=''; let weekdays = getWeekdays(); let weekdayHeaders = container.querySelector('.weekdays'); if(weekdayHeaders) { weekdayHeaders.innerHTML = weekdays.map(d => `<span>${d}</span>`).join(''); } days.forEach(cell=>{ let div=document.createElement('div'); let className='day-cell'; if(!cell.currentMonth) className+=' other-month'; if(!cell.isSelectable) className+=' disabled'; else className+=' available'; div.className=className; div.innerText=cell.day; if(cell.isSelectable){ div.addEventListener('click',(function(dateStr){ return function(){ document.querySelectorAll('#visitaFormContainer .day-cell').forEach(el=>el.classList.remove('selected')); div.classList.add('selected'); selectedDate=dateStr; let horariosContainer=document.querySelector('#visitaFormContainer .horarios-list'); if(horariosContainer) renderHorarios(horariosContainer); }; })(cell.dateStr)); if(selectedDate===cell.dateStr) div.classList.add('selected'); } daysGrid.appendChild(div); }); }
    function renderHorarios(horariosContainer) { if(!horariosContainer) return; if(!selectedDate){ horariosContainer.innerHTML=`<div style="padding:0.6rem; text-align:center;">📅 ${t('select_date')}</div>`; return; } horariosContainer.innerHTML=''; allHorarios.forEach(slot=>{ let badge=document.createElement('span'); badge.className='horario-badge'; badge.innerText=slot; if(selectedHorario===slot) badge.classList.add('selected'); badge.addEventListener('click',()=>{ document.querySelectorAll('#visitaFormContainer .horario-badge').forEach(b=>b.classList.remove('selected')); badge.classList.add('selected'); selectedHorario=slot; }); horariosContainer.appendChild(badge); }); }
    function getMonthName(month) { return t('monthNames')[month]; }
    function getWeekdays() { return t('weekdays'); }
    function getDaysForMonth(year, month) { const firstDay = new Date(year, month, 1); let startWeekday = firstDay.getDay(); let offset = (startWeekday === 0 ? 6 : startWeekday - 1); const daysInMonth = new Date(year, month+1, 0).getDate(), prevMonthDays = new Date(year, month, 0).getDate(); let days = []; for(let i=0;i<offset;i++){ let dayNum = prevMonthDays - offset + i + 1, prevMonth=month-1, prevYear=year; if(prevMonth<0){prevMonth=11; prevYear--;} let dateStr=`${prevYear}-${String(prevMonth+1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`; days.push({day:dayNum, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:false}); } for(let d=1;d<=daysInMonth;d++){ let dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; days.push({day:d, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:true}); } let remaining=42-days.length; for(let i=1;i<=remaining;i++){ let nextMonth=month+1, nextYear=year; if(nextMonth>11){nextMonth=0; nextYear++;} let dateStr=`${nextYear}-${String(nextMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`; days.push({day:i, isSelectable:!isDateInPast(dateStr), dateStr, currentMonth:false}); } return days; }
    function isDateInPast(dateStr) { let date = new Date(dateStr); date.setHours(0,0,0,0); return date < today; }
    function showTermsModal() { document.getElementById('termsModal').style.display='flex'; }
    function closeTermsModal() { document.getElementById('termsModal').style.display='none'; }
    
    document.addEventListener('DOMContentLoaded',()=>{ 
      initMap(); updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click',centrarMapaRapido);
      document.getElementById('servicios-btn').addEventListener('click',abrirServiciosModal);
      document.getElementById('map-btn').addEventListener('click',()=>{ mapa.removeLayer(currentLayer); currentLayer=googleMapsLayer; currentLayer.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); }); 
      document.getElementById('satellite-btn').addEventListener('click',()=>{ mapa.removeLayer(currentLayer); currentLayer=googleSatelliteLayer; currentLayer.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); }); 
      document.getElementById('closeServiciosBtn').addEventListener('click',()=>document.getElementById('serviciosModal').style.display='none');
      document.getElementById('volverPaises').addEventListener('click',volverPaises);
      document.getElementById('closeInfoModalBtn').addEventListener('click',()=>document.getElementById('infoModal').style.display='none');
      window.addEventListener('click',(e)=>{if(e.target===document.getElementById('serviciosModal')) document.getElementById('serviciosModal').style.display='none'; if(e.target===document.getElementById('infoModal')) document.getElementById('infoModal').style.display='none';});
      document.querySelectorAll('.lang-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentLang = btn.getAttribute('data-lang'); updateUILanguage(); refreshAllPopups(); document.getElementById('buscador').value = ''; document.getElementById('sugerencias-busqueda').style.display = 'none'; }); });
      let inputBuscar=document.getElementById('buscador'); inputBuscar.addEventListener('input',(e)=>{ clearTimeout(buscadorTimeout); let term=e.target.value.trim(); let sugDiv=document.getElementById('sugerencias-busqueda'); if(term.length<2){ sugDiv.style.display='none'; return; } sugDiv.innerHTML=`<div class="sugerencia-item">🔍 Searching...</div>`; sugDiv.style.display='block'; buscadorTimeout=setTimeout(()=>buscarInmuebles(term),300); }); inputBuscar.addEventListener('keydown',(e)=>{if(e.key==='Enter'){ e.preventDefault(); let term=inputBuscar.value.trim(); if(term) buscarInmuebles(term); }}); document.addEventListener('click',(e)=>{ if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display='none'; }); document.querySelectorAll('.close-visita-modal, .close-oferta-modal').forEach(btn=>{btn.addEventListener('click',()=>{document.getElementById('visitaModal').style.display='none'; document.getElementById('ofertaModal').style.display='none';});}); window.addEventListener('click',(e)=>{ if(e.target===document.getElementById('visitaModal')) document.getElementById('visitaModal').style.display='none'; if(e.target===document.getElementById('ofertaModal')) document.getElementById('ofertaModal').style.display='none'; if(e.target===document.getElementById('termsModal')) closeTermsModal(); }); document.getElementById('closeTermsBtn').addEventListener('click',closeTermsModal);
      
      document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
      document.querySelector('.lightbox-prev').addEventListener('click', prevLightbox);
      document.querySelector('.lightbox-next').addEventListener('click', nextLightbox);
      lightboxEl.addEventListener('click', (e) => { if(e.target === lightboxEl) closeLightbox(); });
    });
    
    function buscarInmuebles(q){ let term=q.toLowerCase(); let resultados=marcadoresOriginales.filter(m=>m.datosBusqueda.includes(term)); let sugerenciasDiv=document.getElementById('sugerencias-busqueda'); if(resultados.length){ sugerenciasDiv.innerHTML=''; resultados.forEach(m=>{ let title = currentLang === 'es' ? m.datosInmueble.title_es : m.datosInmueble.title_en; let desc = currentLang === 'es' ? m.datosInmueble.description_es : m.datosInmueble.description_en; let item=document.createElement('div'); item.className='sugerencia-item'; item.innerHTML=`<div class="sugerencia-texto"><strong>🔑 ${title}</strong><br><small>${desc}</small></div><button class="sugerencia-boton" data-id="${m.datosInmueble.id}">${currentLang==='es'?'Ver':'View'}</button>`; let btn=item.querySelector('.sugerencia-boton'); btn.addEventListener('click',(e)=>{ e.stopPropagation(); redirigirInmueble(m.datosInmueble); }); item.addEventListener('click',()=>{ redirigirInmueble(m.datosInmueble); }); sugerenciasDiv.appendChild(item); }); } else { sugerenciasDiv.innerHTML=`<div class="sugerencia-item">❌ No verified properties found in USA</div>`; } }
    
    if('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(console.log);
      if(!navigator.serviceWorker.controller) {
        navigator.serviceWorker.register('data:application/javascript,'+encodeURIComponent(`self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => new Response('QRP2P Real Estate USA - Offline mode'))); });`));
      }
    }
  </script>
