    function initMap() { 
      const openStreetMapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
      mapa = L.map('mapa', { center: [20, 0], zoom: 2, zoomControl: false, layers: [openStreetMapLayer] });
      currentLayer = openStreetMapLayer;
      let clusters = L.markerClusterGroup({ iconCreateFunction: cluster => L.divIcon({ html: `<div>${cluster.getChildCount()}</div>`, className: 'cluster-marcadores', iconSize: [40,40] }) }); 
      let icono = L.divIcon({ className: 'negocio-marker', html: '⚡', iconSize: [32,32], popupAnchor: [0,-16] }); 
      verifiedBusinesses.forEach(business => { 
        let popup = generarPopupHTML(business); 
        let marker = L.marker(business.latlng, { icon: icono }).bindPopup(popup, { maxWidth: 380, className: 'custom-popup' }); 
        marker.datosNegocio = business; 
        marker.datosBusqueda = `${business.name_es} ${business.name_en} ${business.category_es} ${business.category_en}`.toLowerCase(); 
        marcadoresOriginales.push(marker); 
        clusters.addLayer(marker); 
      }); 
      mapa.addLayer(clusters); 
    }

      document.getElementById('paisModal').style.display = 'flex';
    }
    
    function mostrarDetalleServicio(pais) {
      let servicioId = servicioSeleccionado.id;
      let datos = serviciosPorPais[servicioId]?.[pais.id];
      let servicioName = currentLang === 'es' ? servicioSeleccionado.name_es : servicioSeleccionado.name_en;
      let paisName = currentLang === 'es' ? pais.name_es : pais.name_en;
      let titulo = `${servicioName} - ${paisName}`;
      document.getElementById('detalle-titulo').innerHTML = titulo;
      let contenido = `
        <div class="contact-info-card">
          <p><strong>Contacto para ${servicioName} en ${paisName}:</strong></p>
          <a href="https://wa.me/${datos.whatsapp}" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp: ${datos.whatsapp}</a>
          <a href="mailto:${datos.email}"><i class="fas fa-envelope"></i> Email: ${datos.email}</a>
          <p style="margin-top:0.8rem;"><i class="fas fa-phone"></i> Teléfono: ${datos.phone}</p>
        </div>
      `;
      document.getElementById('detalle-contenido').innerHTML = contenido;
      document.getElementById('servicioDetalleModal').style.display = 'flex';
    }
    
    function volverServicios() {
      document.getElementById('paisModal').style.display = 'none';
      abrirServiciosModal();
    }
    
    function volverPaises() {
      document.getElementById('servicioDetalleModal').style.display = 'none';
      mostrarPaises();
    }
    
    function updateUILanguage() {
      document.getElementById('buscador').placeholder = t('buscar_placeholder');
      document.getElementById('centrar-text').innerText = t('centrar');
      document.getElementById('servicios-text').innerText = t('servicios');
      document.getElementById('map-text').innerText = t('mapa');
      document.getElementById('satellite-text').innerText = t('satelite');
      document.getElementById('servicios-modal-title').innerText = t('servicios_titulo');
      document.getElementById('pais-modal-title').innerText = t('seleccionar_pais');
      marcadoresOriginales.forEach(marker => { marker.bindPopup(generarPopupHTML(marker.datosNegocio), { maxWidth: 380, className: 'custom-popup' }); });
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>GETTING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { const { latitude, longitude } = pos.coords; if (userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28, 28] }) }).addTo(mapa).bindPopup(currentLang === 'es' ? 'Tu ubicación actual' : 'Your current location'); mapa.setView([latitude, longitude], 14); btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>'; },
          err => { btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>'; mapa.setView([20, 0], 2); alert(currentLang === 'es' ? 'No se pudo obtener tu ubicación.' : 'Could not get your location.'); }
        );
      } else { mapa.setView([20, 0], 2); }
    }
    
    document.addEventListener('DOMContentLoaded', () => { 
      initMap(); updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click', centrarMapaRapido);
      document.getElementById('servicios-btn').addEventListener('click', abrirServiciosModal);
      document.getElementById('map-btn').addEventListener('click', () => { mapa.eachLayer(layer => { if(layer instanceof L.TileLayer && layer !== currentLayer) mapa.removeLayer(layer); }); const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }); currentLayer = osm; osm.addTo(mapa); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); }); 
      document.getElementById('satellite-btn').addEventListener('click', () => { mapa.eachLayer(layer => { if(layer instanceof L.TileLayer && layer !== currentLayer) mapa.removeLayer(layer); }); const satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] }); currentLayer = satellite; satellite.addTo(mapa); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); }); 
      document.getElementById('closeServiciosBtn').addEventListener('click', () => document.getElementById('serviciosModal').style.display='none');
      document.getElementById('closePaisBtn').addEventListener('click', () => document.getElementById('paisModal').style.display='none');
      document.getElementById('closeDetalleBtn').addEventListener('click', () => document.getElementById('servicioDetalleModal').style.display='none');
      document.getElementById('volverServiciosBtn').addEventListener('click', volverServicios);
      document.getElementById('volverPaisesBtn').addEventListener('click', volverPaises);
      document.getElementById('closeInfoModalBtn').addEventListener('click', () => document.getElementById('infoModal').style.display='none');
      window.addEventListener('click', (e) => { if(e.target === document.getElementById('serviciosModal')) document.getElementById('serviciosModal').style.display='none'; if(e.target === document.getElementById('paisModal')) document.getElementById('paisModal').style.display='none'; if(e.target === document.getElementById('servicioDetalleModal')) document.getElementById('servicioDetalleModal').style.display='none'; });
      
      document.querySelectorAll('.lang-btn').forEach(btn => { 
        btn.addEventListener('click', () => { document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentLang = btn.getAttribute('data-lang'); updateUILanguage(); }); 
      });
      
      let inputBuscar = document.getElementById('buscador'); let buscadorTimeout;
      inputBuscar.addEventListener('input', (e) => { clearTimeout(buscadorTimeout); let term = e.target.value.trim(); let sugDiv = document.getElementById('sugerencias-busqueda'); if(term.length < 2) { sugDiv.style.display = 'none'; return; } sugDiv.innerHTML = `<div class="sugerencia-item">🔍 Searching...</div>`; sugDiv.style.display = 'block'; buscadorTimeout = setTimeout(() => { let resultados = marcadoresOriginales.filter(m => m.datosBusqueda.includes(term.toLowerCase())); sugDiv.innerHTML = ''; resultados.forEach(m => { let name = currentLang === 'es' ? m.datosNegocio.name_es : m.datosNegocio.name_en; let item = document.createElement('div'); item.className = 'sugerencia-item'; item.innerHTML = `<div class="sugerencia-texto"><strong>⚡ ${name}</strong></div><button class="sugerencia-boton">${currentLang==='es'?'Ver':'View'}</button>`; item.querySelector('.sugerencia-boton').addEventListener('click', () => { m.openPopup(); mapa.setView(m.getLatLng(), 14); sugDiv.style.display = 'none'; }); sugDiv.appendChild(item); }); if(resultados.length===0) sugDiv.innerHTML = `<div class="sugerencia-item">❌ No results</div>`; }, 300); }); 
    });
  </script>
</body>
</html>
