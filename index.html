    .user-location-marker { background: transparent; border: none; font-size: 28px; display: flex; align-items: center; justify-content: center; }
    
    /* Popup de Negocio Verificado */
    .popup-business-card {
      background: #ffffff;
      border-radius: 24px;

      box-shadow: 0 8px 20px rgba(0,0,0,0.15);

        address_en: "Calle de Alcalá 123, Madrid",

        description_en: "Interior design, branding and sustainable architecture.",
        phone: "+34914567890", 
        email: "hola@madridstudio.es",
        website: "https://madridstudio.es",
        whatsapp: "34612345678"
      }
    ];
    
    const translations = { 
      es: { 
        buscar_placeholder: "Buscar negocios verificados en todo el mundo...", 
        centrar: "CENTRAR", 
        servicios: "SERVICIOS", 
        mapa: "Mapa", 
        satelite: "Satélite", 
        servicios_titulo: "SERVICIOS GLOBALES",
        view_store: "VER TIENDA",
        info_btn: "Info"
      },
      en: { 
        buscar_placeholder: "Search verified businesses worldwide...", 
        centrar: "CENTER", 
        servicios: "SERVICES", 
        mapa: "Map", 
        satelite: "Satellite", 
        servicios_titulo: "GLOBAL SERVICES",
        view_store: "VIEW STORE",
        info_btn: "Info"
      }
    };
    
    let mapa, userMarker, marcadoresOriginales = [], currentLayer;
    function t(key) { return translations[currentLang][key] || key; }
    
    // Generar popup para negocio con botón VER TIENDA/VIEW STORE traducido
    function generarPopupHTML(business) { 
      const name = currentLang === 'es' ? business.name_es : business.name_en;
      const category = currentLang === 'es' ? business.category_es : business.category_en;
      const description = currentLang === 'es' ? business.description_es : business.description_en;
      const address = currentLang === 'es' ? business.address_es : business.address_en;
      const storeText = t('view_store');
      const websiteUrl = business.website || (business.whatsapp ? `https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}` : '#');
      
      let contactButtons = '';
      if(business.website) contactButtons += `<a href="${business.website}" target="_blank" class="contact-link"><i class="fas fa-globe"></i> Web</a>`;
      if(business.whatsapp) contactButtons += `<a href="https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="contact-link"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
      if(business.phone) contactButtons += `<a href="tel:${business.phone}" class="contact-link"><i class="fas fa-phone"></i> Call</a>`;
      if(business.email) contactButtons += `<a href="mailto:${business.email}" class="contact-link"><i class="fas fa-envelope"></i> Email</a>`;
      
      return `<div class="popup-business-card" data-id="${business.id}">
                <div class="popup-business-header">
                  <h3>⚡ ${name}</h3>
                  <span class="popup-business-category">${category}</span>
                </div>
                <div class="popup-business-info">
                  <div class="popup-business-description">${description}</div>
                  <div class="popup-business-address"><i class="fas fa-map-pin"></i> ${address}</div>
                  <div class="popup-business-contact">${contactButtons}</div>
                  <a href="${websiteUrl}" target="_blank" class="btn-view-store"><i class="fas fa-store"></i> ${storeText}</a>
                </div>
              </div>`; 
    }
    
    function initMap() { 
      const openStreetMapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
      mapa = L.map('mapa', { center: [20, 0], zoom: 2, zoomControl: false, layers: [openStreetMapLayer] });
      currentLayer = openStreetMapLayer;
      
      let clusters = L.markerClusterGroup({ iconCreateFunction: cluster => L.divIcon({ html: `<div>${cluster.getChildCount()}</div>`, className: 'cluster-marcadores', iconSize: [40,40] }) }); 
      let icono = L.divIcon({ className: 'negocio-marker', html: '⚡', iconSize: [32,32], popupAnchor: [0,-16] }); 
      
      verifiedBusinesses.forEach(business => { 
        let popup = generarPopupHTML(business); 
        let marker = L.marker(business.latlng, { icon: icono }).bindPopup(popup, { maxWidth: 380, className: 'custom-popup' }); 
        marker.datosNegocio = business; 
        marker.datosBusqueda = `${business.name_es} ${business.name_en} ${business.category_es} ${business.category_en} ${business.description_es} ${business.description_en}`.toLowerCase(); 
        marcadoresOriginales.push(marker); 
        marker.on('popupopen', () => { setTimeout(() => {
            let node = document.querySelector('.custom-popup'); 
            if(node) { 
              let infoSpan = node.querySelector(`.enlace-info`); 
              if(infoSpan) infoSpan.addEventListener('click', (e) => { e.preventDefault(); abrirInfoModal(business); mapa.closePopup(); }); 
            } 
          }, 100); 
        }); 
        clusters.addLayer(marker); 
      }); 
      mapa.addLayer(clusters); 
    }
    
    function abrirInfoModal(business) {
      let name = currentLang === 'es' ? business.name_es : business.name_en;
      let category = currentLang === 'es' ? business.category_es : business.category_en;
      let desc = currentLang === 'es' ? business.description_es : business.description_en;
      let address = currentLang === 'es' ? business.address_es : business.address_en;
      let html = `<div><strong>⚡ ${name}</strong></div><div>📁 ${category}</div><div>📍 ${address}</div><div>📝 ${desc}</div><div>📞 ${business.phone || 'N/A'}</div><div>✉️ ${business.email || 'N/A'}</div><div>🌐 <a href="${business.website}" target="_blank">${business.website}</a></div>`;
      document.getElementById('infoContent').innerHTML = html;
      document.getElementById('infoModal').style.display = 'flex';
    }
    
    function updateUILanguage() {
      document.getElementById('buscador').placeholder = t('buscar_placeholder');
      document.getElementById('centrar-text').innerText = t('centrar');
      document.getElementById('servicios-text').innerText = t('servicios');
      document.getElementById('map-text').innerText = t('mapa');
      document.getElementById('satellite-text').innerText = t('satelite');
      document.getElementById('servicios-modal-title').innerText = t('servicios_titulo');
      // Actualizar popups con el nuevo texto del botón
      marcadoresOriginales.forEach(marker => { 
        let newPopup = generarPopupHTML(marker.datosNegocio); 
        marker.bindPopup(newPopup, { maxWidth: 380, className: 'custom-popup' }); 
      });
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span id="centrar-text">GETTING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => { const { latitude, longitude } = pos.coords; if (userMarker) mapa.removeLayer(userMarker); userMarker = L.marker([latitude, longitude], { icon: L.divIcon({ className: 'user-location-marker', html: '📍', iconSize: [28, 28] }) }).addTo(mapa).bindPopup(currentLang === 'es' ? 'Tu ubicación actual' : 'Your current location'); mapa.setView([latitude, longitude], 14); btn.innerHTML = '<i class="fas fa-location-dot"></i><span id="centrar-text">'+t('centrar')+'</span>'; },
          err => { btn.innerHTML = '<i class="fas fa-location-dot"></i><span id="centrar-text">'+t('centrar')+'</span>'; mapa.setView([20, 0], 2); alert(currentLang === 'es' ? 'No se pudo obtener tu ubicación.' : 'Could not get your location.'); }
        );
      } else { mapa.setView([20, 0], 2); }
    }
    
    function abrirServiciosModal() {
      let container = document.getElementById('serviciosGlobales');
      container.innerHTML = '';
      globalServices.forEach(service => {
        let btn = document.createElement('button');
        btn.className = 'servicio-btn';
        let name = currentLang === 'es' ? service.name_es : service.name_en;
        btn.innerHTML = `<i class="fas ${service.icon}"></i> ${name}`;
        btn.addEventListener('click', () => { window.open(service.url, '_blank'); });
        container.appendChild(btn);
      });
      document.getElementById('serviciosModal').style.display = 'flex';
    }
    
    function buscarNegocios(q) { 
      let term = q.toLowerCase(); 
      let resultados = marcadoresOriginales.filter(m => m.datosBusqueda.includes(term)); 
      let sugerenciasDiv = document.getElementById('sugerencias-busqueda'); 
      if(resultados.length) { 
        sugerenciasDiv.innerHTML = ''; 
        resultados.forEach(m => { 
          let name = currentLang === 'es' ? m.datosNegocio.name_es : m.datosNegocio.name_en;
          let cat = currentLang === 'es' ? m.datosNegocio.category_es : m.datosNegocio.category_en;
          let item = document.createElement('div'); 
          item.className = 'sugerencia-item'; 
          item.innerHTML = `<div class="sugerencia-texto"><strong>⚡ ${name}</strong><br><small>${cat}</small></div><button class="sugerencia-boton" data-id="${m.datosNegocio.id}">${currentLang==='es'?'Ver':'View'}</button>`; 
          let btn = item.querySelector('.sugerencia-boton'); 
          btn.addEventListener('click', (e) => { e.stopPropagation(); abrirInfoModal(m.datosNegocio); }); 
          item.addEventListener('click', () => { abrirInfoModal(m.datosNegocio); }); 
          sugerenciasDiv.appendChild(item); 
        }); 
      } else { 
        sugerenciasDiv.innerHTML = `<div class="sugerencia-item">❌ No verified businesses found</div>`; 
      } 
    }
    
    document.addEventListener('DOMContentLoaded', () => { 
      initMap(); 
      updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click', centrarMapaRapido);
      document.getElementById('servicios-btn').addEventListener('click', abrirServiciosModal);
      document.getElementById('map-btn').addEventListener('click', () => { 
        mapa.eachLayer(layer => { if(layer instanceof L.TileLayer && layer !== currentLayer) mapa.removeLayer(layer); });
        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        currentLayer = osm; osm.addTo(mapa);
        document.getElementById('map-btn').classList.add('active'); 
        document.getElementById('satellite-btn').classList.remove('active'); 
      }); 
      document.getElementById('satellite-btn').addEventListener('click', () => { 
        mapa.eachLayer(layer => { if(layer instanceof L.TileLayer && layer !== currentLayer) mapa.removeLayer(layer); });
        const satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
        currentLayer = satellite; satellite.addTo(mapa);
        document.getElementById('satellite-btn').classList.add('active'); 
        document.getElementById('map-btn').classList.remove('active'); 
      }); 
      document.getElementById('closeServiciosBtn').addEventListener('click', () => document.getElementById('serviciosModal').style.display='none');
      document.getElementById('closeInfoModalBtn').addEventListener('click', () => document.getElementById('infoModal').style.display='none');
      window.addEventListener('click', (e) => { if(e.target === document.getElementById('serviciosModal')) document.getElementById('serviciosModal').style.display='none'; if(e.target === document.getElementById('infoModal')) document.getElementById('infoModal').style.display='none'; });
      
      document.querySelectorAll('.lang-btn').forEach(btn => { 
        btn.addEventListener('click', () => { 
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); 
          btn.classList.add('active'); 
          currentLang = btn.getAttribute('data-lang'); 
          updateUILanguage(); 
          document.getElementById('buscador').value = ''; 
          document.getElementById('sugerencias-busqueda').style.display = 'none'; 
        }); 
      });
      
      let inputBuscar = document.getElementById('buscador'); 
      let buscadorTimeout;
      inputBuscar.addEventListener('input', (e) => { 
        clearTimeout(buscadorTimeout); 
        let term = e.target.value.trim(); 
        let sugDiv = document.getElementById('sugerencias-busqueda'); 
        if(term.length < 2) { sugDiv.style.display = 'none'; return; } 
        sugDiv.innerHTML = `<div class="sugerencia-item">🔍 Searching...</div>`; 
        sugDiv.style.display = 'block'; 
        buscadorTimeout = setTimeout(() => buscarNegocios(term), 300); 
      }); 
      inputBuscar.addEventListener('keydown', (e) => { if(e.key === 'Enter') { e.preventDefault(); let term = inputBuscar.value.trim(); if(term) buscarNegocios(term); } }); 
      document.addEventListener('click', (e) => { if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display = 'none'; }); 
    });
  </script>
</body>
</html>
