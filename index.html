    .botones-derecha { display: flex; gap: 0.5rem; background: #f0f0f0; padding: 0.3rem; border-radius: 50px; }
    .map-type-btn { padding: 0.5rem 1rem; border: none; border-radius: 40px; cursor: pointer; background: transparent; font-family: 'Libre Baskerville', serif; font-weight: 600; }
    .map-type-btn.active { background: #000000; color: white; }
    .lang-selector { display: flex; gap: 0.3rem; margin-left: 0.5rem; }
    .lang-btn { background: transparent; border: 1px solid #ccc; border-radius: 20px; padding: 0.4rem 0.8rem; cursor: pointer; font-family: 'Libre Baskerville', serif; font-weight: 600; font-size: 0.8rem; }
    .lang-btn.active { background: #000000; color: white; border-color: #000000; }
    #mapa { flex: 1; background: #f0f0f0; width: 100%; min-height: 0; }

    .sugerencia-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .sugerencia-item:hover { background-color: #f5f5f5; }
    .sugerencia-texto { flex: 1; }
    .sugerencia-boton { margin-left: 10px; padding: 6px 12px; background-color: #000000; color: white; border: none; border-radius: 20px; cursor: pointer; }
    
    /* Popup de Negocio Verificado */
    .popup-business-card {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      width: 340px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);

    }
    .popup-business-header h3 {

    }
    .popup-business-category {

      display: inline-block;

      border-radius: 50px;
    }
    .popup-business-info {

    }
    .popup-business-description {

      color: #555;

      line-height: 1.4;
    }
    .popup-business-address {

      color: #333;
      margin-bottom: 0.8rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
    }
    .popup-business-address i {
      margin-top: 0.2rem;
      color: #000;
    }
    .popup-business-contact {
      display: flex;
      flex-wrap: wrap;

      margin-top: 0.5rem;

      padding-top: 0.8rem;

    .contact-link {
      font-size: 0.7rem;
      background: #f5f5f5;
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      text-decoration: none;
      color: #000;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 600;
    }
    .contact-link i { font-size: 0.7rem; }
    .btn-view-store {
      display: block;
      background: #000000;
      color: white;
      text-align: center;
      padding: 0.7rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.8rem;
      margin-top: 0.8rem;
      transition: all 0.2s ease;
    }
    .btn-view-store:hover { background: #333333; transform: scale(0.98); }
    
    /* Modales de Servicios */
    .pais-modal, .servicio-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;

      background-color: rgba(0, 0, 0, 0.85);

      justify-content: center;

    .pais-container, .servicio-container {

    .servicios-botones {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .pais-btn, .servicio-item-btn {
      background: #000000;

      border: none;
      padding: 0.8rem;
      border-radius: 50px;
      font-size: 0.9rem;

      cursor: pointer;

      font-family: 'Libre Baskerville', serif;

    .info-modal {

</head>

  <!-- Cargar Google Maps API -->

  <script>
    const WHATSAPP_NUMBER = "573041146297";
    let currentLang = 'en';
    let paisSeleccionado = null;
    let mapa, userMarker, marcadores = [], infoWindow, autocomplete;
    
    // PAÍSES DISPONIBLES
    const paisesDisponibles = [
      { id: "colombia", name_en: "Colombia", name_es: "Colombia", code: "CO" },
      { id: "usa", name_en: "United States", name_es: "Estados Unidos", code: "US" }
    ];
    
    // SERVICIOS (6 servicios)
    const serviciosLista = [
      { id: "plan-anual", name_en: "ANNUAL PLAN", name_es: "PLAN ANUAL", icon: "fa-calendar-alt" },
      { id: "administracion", name_en: "ADMINISTRATION", name_es: "ADMINISTRACIÓN", icon: "fa-building" },
      { id: "marketing", name_en: "MARKETING", name_es: "MARKETING", icon: "fa-chart-line" },
      { id: "logistica", name_en: "LOGISTICS", name_es: "LOGÍSTICA", icon: "fa-truck" },
      { id: "finanzas", name_en: "FINANCE", name_es: "FINANZAS", icon: "fa-coins" },
      { id: "dropshipping", name_en: "DROPSHIPPING", name_es: "DROPSHIPPING", icon: "fa-boxes" }
    ];
    
    // URLs de redirección
    const urlsRedireccion = {
      "plan-anual": { "colombia": "https://qrp2p.com/plan-anual/colombia", "usa": "https://qrp2p.com/plan-anual/usa" },
      "administracion": { "colombia": "https://qrp2p.com/administracion/colombia", "usa": "https://qrp2p.com/administracion/usa" },
      "marketing": { "colombia": "https://qrp2p.com/marketing/colombia", "usa": "https://qrp2p.com/marketing/usa" },
      "logistica": { "colombia": "https://qrp2p.com/logistica/colombia", "usa": "https://qrp2p.com/logistica/usa" },
      "finanzas": { "colombia": "https://qrp2p.com/finanzas/colombia", "usa": "https://qrp2p.com/finanzas/usa" },
      "dropshipping": { "colombia": "https://qrp2p.com/dropshipping/colombia", "usa": "https://qrp2p.com/dropshipping/usa" }
    };
    
    // NEGOCIOS VERIFICADOS - SOLO COLOMBIA
    const verifiedBusinesses = [
      { 
        id: "WSC01", 
        name_es: "WSC DISTRIBUIDORA", 
        name_en: "WSC DISTRIBUIDORA", 
        category_es: "Distribuidora Mayorista", 
        category_en: "Wholesale Distributor", 
        latlng: { lat: 4.6097, lng: -74.0817 },
        address_es: "San Victorino, Centro, Bogotá", 
        address_en: "San Victorino, Downtown, Bogotá", 
        description_es: "Distribuidora mayorista con los mejores precios en abarrotes, víveres y productos de consumo masivo.", 
        description_en: "Wholesale distributor with the best prices in groceries, food and consumer products.", 
        phone: "+573001234567", 
        email: "ventas@wscdistribuidora.com", 
        website: "https://wscdistribuidora.com", 
        whatsapp: "573001234567" 
      },
      { 
        id: "BIZ05", 
        name_es: "DISTRIBUIDORA LA 80", 
        name_en: "DISTRIBUIDORA LA 80", 
        category_es: "Distribuidora Mayorista", 
        category_en: "Wholesale Distributor", 
        latlng: { lat: 4.6877, lng: -74.1040 },
        address_es: "Calle 80 # 77-25, Bogotá", 
        address_en: "Calle 80 # 77-25, Bogotá", 
        description_es: "Distribución de productos de aseo, limpieza y hogar. Precios de fábrica y entrega inmediata.", 
        description_en: "Distribution of cleaning and home products. Factory prices and immediate delivery.", 
        phone: "+573001234568", 
        email: "ventas@distribuidoral80.com", 
        website: "https://distribuidoral80.com", 
        whatsapp: "573001234568" 
      },
      { 
        id: "BIZ06", 
        name_es: "DISTRIBUIDORA CALI CENTRO", 
        name_en: "DISTRIBUIDORA CALI CENTRO", 
        category_es: "Distribuidora Mayorista", 
        category_en: "Wholesale Distributor", 
        latlng: { lat: 3.4516, lng: -76.5320 },
        address_es: "Calle 13 # 4-30, Centro, Cali", 
        address_en: "Calle 13 # 4-30, Downtown, Cali", 
        description_es: "Especialistas en distribución de bebidas, licores y productos gourmet en el Valle del Cauca.", 
        description_en: "Specialists in distribution of beverages, liquors and gourmet products in Valle del Cauca.", 
        phone: "+573001234569", 
        email: "ventas@distribuidoracali.com", 
        website: "https://distribuidoracali.com", 
        whatsapp: "573001234569" 
      }
    ];
    
    const translations = { 
      es: { buscar_placeholder: "Buscar negocios verificados en Colombia...", centrar: "CENTRAR", servicios: "SERVICIOS", mapa: "Mapa", satelite: "Satélite", seleccionar_pais: "SELECCIONAR PAÍS", seleccionar_servicio: "SELECCIONAR SERVICIO", view_store: "VER TIENDA" },
      en: { buscar_placeholder: "Search verified businesses in Colombia...", centrar: "CENTER", servicios: "SERVICES", mapa: "Map", satelite: "Satellite", seleccionar_pais: "SELECT COUNTRY", seleccionar_servicio: "SELECT SERVICE", view_store: "VIEW STORE" }
    };
    
    function t(key) { return translations[currentLang][key] || key; }
    
    function generarPopupHTML(business) { 
      const name = currentLang === 'es' ? business.name_es : business.name_en;
      const category = currentLang === 'es' ? business.category_es : business.category_en;
      const description = currentLang === 'es' ? business.description_es : business.description_en;
      const address = currentLang === 'es' ? business.address_es : business.address_en;
      const storeText = t('view_store');
      const websiteUrl = business.website || (business.whatsapp ? `https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}` : '#');
      let contactButtons = '';
      if(business.website) contactButtons += `<a href="${business.website}" target="_blank" class="contact-link"><i class="fas fa-globe"></i> Web</a>`;
      if(business.whatsapp) contactButtons += `<a href="https://wa.me/${business.whatsapp.replace(/[^0-9]/g, '')}" target="_blank" class="contact-link"><i class="fab fa-whatsapp"></i> WhatsApp</a>`;
      if(business.phone) contactButtons += `<a href="tel:${business.phone}" class="contact-link"><i class="fas fa-phone"></i> Call</a>`;
      if(business.email) contactButtons += `<a href="mailto:${business.email}" class="contact-link"><i class="fas fa-envelope"></i> Email</a>`;
      return `<div class="popup-business-card"><div class="popup-business-header"><h3>⚡ ${name}</h3><span class="popup-business-category">${category}</span></div><div class="popup-business-info"><div class="popup-business-description">${description}</div><div class="popup-business-address"><i class="fas fa-map-pin"></i> ${address}</div><div class="popup-business-contact">${contactButtons}</div><a href="${websiteUrl}" target="_blank" class="btn-view-store"><i class="fas fa-store"></i> ${storeText}</a></div></div>`; 
    }
    
    function initMap() {
      // Centrar en Colombia
      const colombiaCenter = { lat: 4.5709, lng: -74.2973 };
      
      mapa = new google.maps.Map(document.getElementById('mapa'), {
        center: colombiaCenter,
        zoom: 6,
        mapTypeId: 'roadmap',
        zoomControl: false,
        fullscreenControl: false,
        streetViewControl: false,
        mapTypeControl: false
      });
      
      infoWindow = new google.maps.InfoWindow();
      
      // Crear marcadores personalizados con ícono de rayo
      verifiedBusinesses.forEach(business => {
        const marker = new google.maps.Marker({
          position: business.latlng,
          map: mapa,
          icon: {
            path: 'M12 2L2 22h20L12 2z M12 6l6 14H6l6-14z',
            fillColor: '#FFD700',
            fillOpacity: 1,
            strokeColor: '#000000',
            strokeWeight: 1.5,
            scale: 1.2,
            anchor: new google.maps.Point(12, 22)
          },
          title: business.name_es
        });
        
        marker.datosNegocio = business;
        marker.datosBusqueda = `${business.name_es} ${business.name_en} ${business.category_es} ${business.category_en} ${business.description_es} ${business.description_en}`.toLowerCase();
        marcadores.push(marker);
        
        marker.addListener('click', () => {
          infoWindow.setContent(generarPopupHTML(business));
          infoWindow.open(mapa, marker);
        });
      });
      
      // Configurar autocompletado para el buscador
      const input = document.getElementById('buscador');
      autocomplete = new google.maps.places.Autocomplete(input);
      autocomplete.bindTo('bounds', mapa);
      
      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();
        if (!place.geometry) return;
        
        if (place.geometry.viewport) {
          mapa.fitBounds(place.geometry.viewport);
        } else {
          mapa.setCenter(place.geometry.location);
          mapa.setZoom(15);
        }
        
        // También buscar negocios por nombre
        const term = input.value.trim().toLowerCase();
        if(term.length > 0) {
          buscarNegocios(term);
        }
      });
      
      // Búsqueda manual
      input.addEventListener('input', (e) => {
        const term = e.target.value.trim();
        if(term.length >= 2) {
          buscarNegocios(term);
        } else {
          document.getElementById('sugerencias-busqueda').style.display = 'none';
        }
      });
    }
    
    function buscarNegocios(term) {
      const resultados = marcadores.filter(m => m.datosBusqueda.includes(term.toLowerCase()));
      const sugerenciasDiv = document.getElementById('sugerencias-busqueda');
      
      if(resultados.length > 0) {
        sugerenciasDiv.innerHTML = '';
        resultados.forEach(marker => {
          const business = marker.datosNegocio;
          const name = currentLang === 'es' ? business.name_es : business.name_en;
          const item = document.createElement('div');
          item.className = 'sugerencia-item';
          item.innerHTML = `<div class="sugerencia-texto"><strong>⚡ ${name}</strong><br><small>${business.category_es}</small></div><button class="sugerencia-boton">${currentLang==='es'?'Ver':'View'}</button>`;
          item.querySelector('.sugerencia-boton').addEventListener('click', () => {
            mapa.setCenter(marker.getPosition());
            mapa.setZoom(16);
            google.maps.event.trigger(marker, 'click');
            sugerenciasDiv.style.display = 'none';
          });
          sugerenciasDiv.appendChild(item);
        });
        sugerenciasDiv.style.display = 'block';
      } else {
        sugerenciasDiv.innerHTML = `<div class="sugerencia-item">❌ No results found</div>`;
        sugerenciasDiv.style.display = 'block';
      }
    }
    
    function mostrarPaises() {
      let container = document.getElementById('listaPaises');
      container.innerHTML = '';
      paisesDisponibles.forEach(pais => {
        let btn = document.createElement('button');
        btn.className = 'pais-btn';
        let name = currentLang === 'es' ? pais.name_es : pais.name_en;
        btn.innerHTML = `<i class="fas fa-flag"></i> ${name}`;
        btn.addEventListener('click', () => {
          paisSeleccionado = pais;
          document.getElementById('paisModal').style.display = 'none';
          mostrarServicios();
        });
        container.appendChild(btn);
      });
      document.getElementById('paisModal').style.display = 'flex';
    }
    
    function mostrarServicios() {
      let container = document.getElementById('listaServicios');
      container.innerHTML = '';
      serviciosLista.forEach(servicio => {
        let btn = document.createElement('button');
        btn.className = 'servicio-item-btn';
        let name = currentLang === 'es' ? servicio.name_es : servicio.name_en;
        btn.innerHTML = `<i class="fas ${servicio.icon}"></i> ${name}`;
        btn.addEventListener('click', () => {
          let url = urlsRedireccion[servicio.id]?.[paisSeleccionado.id];
          if(url) window.open(url, '_blank');
          else window.open('https://qrp2p.com', '_blank');
          document.getElementById('servicioModal').style.display = 'none';
        });
        container.appendChild(btn);
      });
      document.getElementById('servicioModal').style.display = 'flex';
    }
    
    function volverPaises() {
      document.getElementById('servicioModal').style.display = 'none';
      mostrarPaises();
    }
    
    function centrarMapaRapido() {
      if (navigator.geolocation) {
        const btn = document.getElementById('centrar-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>GETTING...</span>';
        navigator.geolocation.getCurrentPosition(
          pos => {
            const userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            mapa.setCenter(userLocation);
            mapa.setZoom(15);
            if (userMarker) userMarker.setMap(null);
            userMarker = new google.maps.Marker({
              position: userLocation,
              map: mapa,
              icon: {
                path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z',
                fillColor: '#4285F4',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 2,
                scale: 1,
                anchor: new google.maps.Point(12, 22)
              },
              title: currentLang === 'es' ? 'Tu ubicación' : 'Your location'
            });
            btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>';
          },
          err => {
            btn.innerHTML = '<i class="fas fa-location-dot"></i><span>'+t('centrar')+'</span>';
            mapa.setCenter({ lat: 4.5709, lng: -74.2973 });
            mapa.setZoom(6);
            alert(currentLang === 'es' ? 'No se pudo obtener tu ubicación.' : 'Could not get your location.');
          }
        );
      } else {
        mapa.setCenter({ lat: 4.5709, lng: -74.2973 });
        mapa.setZoom(6);
      }
    }
    
    function updateUILanguage() {
      document.getElementById('buscador').placeholder = t('buscar_placeholder');
      document.getElementById('centrar-text').innerText = t('centrar');
      document.getElementById('servicios-text').innerText = t('servicios');
      document.getElementById('map-text').innerText = t('mapa');
      document.getElementById('satellite-text').innerText = t('satelite');
      document.getElementById('pais-modal-title').innerText = t('seleccionar_pais');
      document.getElementById('servicio-modal-title').innerText = t('seleccionar_servicio');
    }
    
    document.addEventListener('DOMContentLoaded', () => {
      updateUILanguage();
      document.getElementById('centrar-btn').addEventListener('click', centrarMapaRapido);
      document.getElementById('servicios-btn').addEventListener('click', mostrarPaises);
      document.getElementById('map-btn').addEventListener('click', () => { if(mapa) mapa.setMapTypeId('roadmap'); document.getElementById('map-btn').classList.add('active'); document.getElementById('satellite-btn').classList.remove('active'); });
      document.getElementById('satellite-btn').addEventListener('click', () => { if(mapa) mapa.setMapTypeId('satellite'); document.getElementById('satellite-btn').classList.add('active'); document.getElementById('map-btn').classList.remove('active'); });
      document.getElementById('closePaisBtn').addEventListener('click', () => document.getElementById('paisModal').style.display='none');
      document.getElementById('closeServicioBtn').addEventListener('click', () => document.getElementById('servicioModal').style.display='none');
      document.getElementById('volverPaisesBtn').addEventListener('click', volverPaises);
      document.getElementById('closeInfoModalBtn').addEventListener('click', () => document.getElementById('infoModal').style.display='none');
      window.addEventListener('click', (e) => { if(e.target === document.getElementById('paisModal')) document.getElementById('paisModal').style.display='none'; if(e.target === document.getElementById('servicioModal')) document.getElementById('servicioModal').style.display='none'; });
      document.querySelectorAll('.lang-btn').forEach(btn => { btn.addEventListener('click', () => { document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentLang = btn.getAttribute('data-lang'); updateUILanguage(); }); });
      document.addEventListener('click', (e) => { if(!e.target.closest('.contenedor-buscador')) document.getElementById('sugerencias-busqueda').style.display = 'none'; });
    });
  </script>
</body>
</html>
