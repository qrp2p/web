            document.addEventListener(eventType, function(e) {
                const isSearchInput = e.target.id === 'countrySearch' || e.target.closest('#countrySearch');
                if (!isSearchInput) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
                return true;
            });
        });
        
        document.addEventListener('keydown', function(e) {
            const isSearchInputFocused = document.activeElement && document.activeElement.id === 'countrySearch';
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 'a')) {
                if (!isSearchInputFocused) {
                    e.preventDefault();
                    return false;
                }
            }
        });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, false);
    })();

            tayikistan_name: "Tajikistan", tayikistan_sub: "18MLS REAL ESTATE TAJIKISTAN",
            timor_oriental_name: "East Timor", timor_oriental_sub: "18MLS REAL ESTATE EAST TIMOR",
            togo_name: "Togo", togo_sub: "18MLS REAL ESTATE TOGO",
            tonga_name: "Tonga", tonga_sub: "18MLS REAL ESTATE TONGA",
            trinidad_tobago_name: "Trinidad and Tobago", trinidad_tobago_sub: "18MLS REAL ESTATE TRINIDAD AND TOBAGO",
            tunez_name: "Tunisia", tunez_sub: "18MLS REAL ESTATE TUNISIA",
            turkmenistan_name: "Turkmenistan", turkmenistan_sub: "18MLS REAL ESTATE TURKMENISTAN",
            turquia_name: "Turkey", turquia_sub: "18MLS REAL ESTATE TURKEY",
            tuvalu_name: "Tuvalu", tuvalu_sub: "18MLS REAL ESTATE TUVALU",
            ucrania_name: "Ukraine", ucrania_sub: "18MLS REAL ESTATE UKRAINE",
            uganda_name: "Uganda", uganda_sub: "18MLS REAL ESTATE UGANDA",
            uruguay_name: "Uruguay", uruguay_sub: "18MLS REAL ESTATE URUGUAY",
            uzbekistan_name: "Uzbekistan", uzbekistan_sub: "18MLS REAL ESTATE UZBEKISTAN",
            vanuatu_name: "Vanuatu", vanuatu_sub: "18MLS REAL ESTATE VANUATU",
            venezuela_name: "Venezuela", venezuela_sub: "18MLS REAL ESTATE VENEZUELA",
            vietnam_name: "Vietnam", vietnam_sub: "18MLS REAL ESTATE VIETNAM",
            wallis_futuna_name: "Wallis and Futuna", wallis_futuna_sub: "18MLS REAL ESTATE WALLIS AND FUTUNA",
            yemen_name: "Yemen", yemen_sub: "18MLS REAL ESTATE YEMEN",
            yibuti_name: "Djibouti", yibuti_sub: "18MLS REAL ESTATE DJIBOUTI",
            zambia_name: "Zambia", zambia_sub: "18MLS REAL ESTATE ZAMBIA",
            zimbabue_name: "Zimbabwe", zimbabue_sub: "18MLS REAL ESTATE ZIMBABWE",
            footer_copyright: "© 18MLS.COM — The largest real estate MLS in the world",
            footer_tagline: "direct properties · no intermediaries · smart investing",
            no_results: "No countries found. Try another search term.",
            install_text: "📱 Install 18MLS App",
            install_btn: "Install"
        }
    };

    // --------------------------------------------------------------
    // 4. RESTO DEL CÓDIGO (RENDER, BÚSQUEDA, IDIOMAS, PWA)
    // --------------------------------------------------------------
    let currentLang = 'es';
    let currentFilter = '';
    let deferredPrompt = null;

    function normalizeString(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\w\s]/g, '');
    }

    function getSearchableTextForCountry(country, langData) {
        const countryName = langData[country.nameKey] || '';
        const countrySub = langData[country.subKey] || '';
        const baseTerms = country.searchTerms || [];
        let combined = `${countryName} ${countrySub} ${baseTerms.join(' ')}`.toLowerCase();
        return normalizeString(combined);
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderCountries() {
        const container = document.getElementById('countriesContainer');
        if (!container) return;
        const langData = translations[currentLang];
        const filterNorm = normalizeString(currentFilter);
        
        let html = '';
        let visibleCount = 0;
        
        countriesData.forEach(country => {
            const searchableText = getSearchableTextForCountry(country, langData);
            const matches = filterNorm === '' || searchableText.includes(filterNorm);
            if (matches) visibleCount++;
            
            const countryName = langData[country.nameKey];
            const countrySub = langData[country.subKey];
            const displayStyle = matches ? '' : 'hidden-card';
            
            // ✅ AHORA LA URL ES UNA RUTA (ejemplo: https://18mls.com/co)
            const fullUrl = `https://${country.domain}`;
            
            html += `
                <a href="${fullUrl}" class="country-card ${displayStyle}" target="_self" rel="noopener noreferrer" data-country-id="${country.id}">
                    <div class="country-flag">${country.flag}</div>
                    <div class="country-name">${escapeHtml(countryName)}</div>
                    <div class="country-sub">${escapeHtml(countrySub)}</div>
                    <div class="divider" style="margin: 0.8rem auto; width: 30px;"></div>
                    <div class="country-domain">${fullUrl}</div>
                </a>
            `;
        });
        
        if (visibleCount === 0 && currentFilter !== '') {
            html += `<div class="no-results">${escapeHtml(langData.no_results)}</div>`;
        }
        
        container.innerHTML = html;
        
        const resultsSpan = document.getElementById('resultsCount');
        if (resultsSpan) {
            if (currentFilter === '') {
                resultsSpan.innerHTML = '';
            } else {
                const resultText = currentLang === 'es' 
                    ? `${visibleCount} resultado${visibleCount !== 1 ? 's' : ''} encontrado${visibleCount !== 1 ? 's' : ''}`
                    : `${visibleCount} result${visibleCount !== 1 ? 's' : ''} found`;
                resultsSpan.innerHTML = resultText;
            }
        }
        
        const clearBtn = document.getElementById('clearSearch');
        if (clearBtn) {
            clearBtn.style.display = currentFilter !== '' ? 'block' : 'none';
        }
    }

    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        const elements = document.querySelectorAll('[data-i18n]');
        elements.forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key] !== undefined) {
                if (key === 'title') {
                    el.innerHTML = translations[lang][key];
                } else {
                    el.innerText = translations[lang][key];
                }
            }
        });
        const searchInput = document.getElementById('countrySearch');
        if (searchInput) {
            searchInput.placeholder = currentLang === 'es' ? 'Buscar país...' : 'Search country...';
        }
        renderCountries();
        
        document.getElementById('lang-es').classList.toggle('active', lang === 'es');
        document.getElementById('lang-en').classList.toggle('active', lang === 'en');
        document.documentElement.lang = lang === 'es' ? 'es' : 'en';
        localStorage.setItem('18mls_lang', lang);
    }

    let debounceTimer;
    function onSearchInput(value) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            currentFilter = value;
            renderCountries();
        }, 180);
    }

    function initSearch() {
        const searchInput = document.getElementById('countrySearch');
        const clearBtn = document.getElementById('clearSearch');
        if (!searchInput) return;
        
        searchInput.addEventListener('input', (e) => {
            onSearchInput(e.target.value);
        });
        
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                onSearchInput('');
                searchInput.focus();
            });
        }
    }

    function initPWAInstall() {
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBanner = document.getElementById('installBanner');
            if (installBanner) installBanner.style.display = 'flex';
        });

        const installBtn = document.getElementById('installBtn');
        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('PWA instalada');
                        const installBanner = document.getElementById('installBanner');
                        if (installBanner) installBanner.style.display = 'none';
                    }
                    deferredPrompt = null;
                }
            });
        }
    }

    function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/worker.js')
                    .then(registration => {
                        console.log('Service Worker registrado:', registration);
                    })
                    .catch(error => {
                        console.log('Error al registrar Service Worker:', error);
                    });
            });
        }
    }

    function loadInitialLanguage() {
        const savedLang = localStorage.getItem('18mls_lang');
        if (savedLang && (savedLang === 'es' || savedLang === 'en')) {
            setLanguage(savedLang);
        } else {
            const browserLang = navigator.language || '';
            setLanguage(browserLang.startsWith('es') ? 'es' : 'en');
        }
    }

    function bindLanguageEvents() {
        document.getElementById('lang-es').addEventListener('click', () => setLanguage('es'));
        document.getElementById('lang-en').addEventListener('click', () => setLanguage('en'));
    }

    window.addEventListener('DOMContentLoaded', () => {
        initSearch();
        bindLanguageEvents();
        loadInitialLanguage();
        renderCountries();
        initPWAInstall();
        registerServiceWorker();
        
        const searchInputPlace = document.getElementById('countrySearch');
        if (searchInputPlace) {
            searchInputPlace.placeholder = currentLang === 'es' ? 'Buscar país...' : 'Search country...';
        }
    });
</script>
</body>
</html>
